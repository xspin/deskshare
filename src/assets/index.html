<!DOCTYPE html>
<html>
<head>
  <title>DeskShare {{version}}</title>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    body {
      margin: 0;
      background-color: black;
    }

    div#info {
      position: absolute;
      top: 10px;
      right: 20px;
      text-align: right;
      width: auto;
      z-index: 99;
    }

    div#info a {
      margin-left: 0.5em;
      font-size: 12px;
      color: gray;
    }

    div#info:hover {
      background-color: black;
    }
  </style>
</head>

<body>
  <div id="info">
    <a id="fps"></a>
    <a id="speed"></a>
    <a id="delay"></a>
    <a id="state"></a>
  </div>

  <div style="background-color:black; width: 100%; height: 100%; position: absolute; top: 0; left: 0; margin: 0;">
    <canvas id="video" style=" height: 100%;"></canvas>
  </div>

  <script src="wsjpeg.min.js"></script>
</body>

</html>
