<!DOCTYPE html>
<html>
<head>
  <title>DeskShare {{version}}</title>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="player.css">
</head>

<body>
  <div class="alert-container" id="alertBox">
    <button class="close-btn" id="closeBtn">&times;</button>
    <span id="alertText"></span>
  </div>

  <button id="pauseBtn" class="pause"></button>

  <div id="info">
    <a id="fps"></a>
    <a id="speed"></a>
    <a id="delay"></a>
    <a id="state"></a>
    <a id="clients"></a>
  </div>
  <div id="details" class="hidden"></div>

  <div style="background-color:black; width: 100%; height: 100%; position: absolute; top: 0; left: 0; margin: 0;">
    <canvas id="video" style=" height: 100%;"></canvas>
  </div>

  <div style="position: absolute; bottom: 20px; right: 20px; z-index: 100;">
    <button id="toggleBtn">▣</button>
  </div>

  <div id="play-container">
   <svg width="100" height="100" viewBox="0 0 100 100"><polygon points="20,20 20,80 80,50" fill="white" stroke="black" stroke-width="1"/> </svg>
  </div>

  <script src="player.js"></script>

</body>
</html>
